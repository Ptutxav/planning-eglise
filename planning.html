<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planning Église - Export PDF Fixé</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .row-height { min-height: 140px; }
        
        .custom-scrollbar::-webkit-scrollbar { width: 8px; height: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        [v-cloak] { display: none; }

        /* MODE IMPRESSION - Simplification totale du layout */
        body.printing-active {
            overflow: visible !important;
        }
        
        body.printing-active #planning-container {
            overflow: visible !important;
            padding: 0 !important;
        }
        
        body.printing-active #planning-board {
            position: static !important;
            display: block !important;
            overflow: visible !important;
            background: white !important;
            padding: 20px !important;
        }
        
        body.printing-active .sticky {
            position: static !important;
        }
        
        body.printing-active .overflow-auto,
        body.printing-active .overflow-y-auto,
        body.printing-active .custom-scrollbar {
            overflow: visible !important;
            max-height: none !important;
        }
        
        body.printing-active .planning-columns {
            display: flex !important;
            flex-wrap: nowrap !important;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 h-screen flex flex-col overflow-hidden font-sans" v-cloak>

<div id="app" class="flex flex-1 h-full overflow-hidden">

    <div class="w-80 bg-white border-r border-gray-300 flex flex-col shadow-xl z-20 shrink-0" data-html2canvas-ignore>
        <div class="p-4 border-b bg-gray-50">
            <h2 class="font-bold text-lg text-gray-800 flex items-center">
                <i class="fas fa-layer-group mr-2 text-indigo-600"></i> Effectif
            </h2>
            <input type="text" v-model="searchQuery" placeholder="Rechercher..." class="mt-3 w-full p-2 border border-gray-300 rounded text-sm focus:outline-none focus:border-indigo-500 transition">
        </div>

        <div class="flex-1 overflow-y-auto p-3 space-y-2 bg-slate-50 custom-scrollbar">
            <div 
                v-for="person in filteredPersons" 
                :key="person.id"
                draggable="true"
                @dragstart="startDrag($event, person, null)" 
                class="p-3 bg-white border border-gray-200 rounded-lg shadow-sm cursor-grab hover:shadow-md hover:-translate-y-0.5 transition-all border-l-4 group relative"
                :class="person.role === 'Conseil' ? 'border-l-purple-500' : 'border-l-indigo-500'"
            >
                <button @click="startEdit(person)" class="absolute top-2 right-2 text-gray-300 hover:text-indigo-600 transition" title="Modifier">
                    <i class="fas fa-pencil-alt text-xs"></i>
                </button>

                <div class="flex justify-between items-center pr-6">
                    <span class="font-bold text-gray-700">{{ person.name }}</span>
                </div>
                
                <div class="flex items-center gap-2 mt-1">
                    <span v-if="person.role === 'Conseil'" class="text-[10px] uppercase font-bold bg-purple-100 text-purple-700 px-1.5 py-0.5 rounded">Conseil</span>
                    <span v-if="person.familyId" class="bg-gray-100 px-1.5 py-0.5 rounded text-gray-600 text-xs">
                        <i class="fas fa-home text-[10px]"></i> {{ person.familyId }}
                    </span>
                </div>

                <div v-if="getRestCount(person.id) === 0 && person.role !== 'Conseil'" class="mt-2 text-[10px] text-red-600 font-bold bg-red-50 px-2 py-1 rounded flex items-center border border-red-100">
                    <i class="fas fa-exclamation-circle mr-1"></i> Pas de repos ce mois-ci
                </div>
            </div>
        </div>

        <div class="border-t bg-gray-100 text-sm border-t-4 transition-colors duration-300" 
             :class="editingId ? 'border-t-orange-400 bg-orange-50' : 'border-t-transparent'">
            <button @click="toggleForm" class="w-full flex justify-between items-center p-3 font-bold text-gray-600 hover:bg-gray-200 focus:outline-none">
                <span>{{ editingId ? 'Modifier la personne' : 'Ajouter une personne' }}</span>
                <i class="fas" :class="isFormOpen ? 'fa-chevron-down' : 'fa-chevron-up'"></i>
            </button>
            <div v-show="isFormOpen" class="px-3 pb-3 space-y-2">
                <input v-model="formPerson.name" placeholder="Nom Prénom" class="w-full p-2 border rounded shadow-sm focus:border-indigo-500 focus:outline-none">
                <div class="flex gap-2">
                    <select v-model="formPerson.role" class="w-1/2 p-2 border rounded shadow-sm bg-white">
                        <option value="Membre">Membre</option>
                        <option value="Conseil">Conseil</option>
                    </select>
                    <input v-model="formPerson.family" placeholder="Famille..." class="w-1/2 p-2 border rounded shadow-sm focus:border-indigo-500 focus:outline-none">
                </div>
                <div class="flex gap-2">
                    <button v-if="editingId" @click="cancelEdit" class="w-1/3 bg-gray-300 text-gray-700 py-2 rounded shadow hover:bg-gray-400 transition">Annuler</button>
                    <button @click="savePerson" class="flex-1 text-white py-2 rounded shadow transition font-medium" :class="editingId ? 'bg-orange-500 hover:bg-orange-600' : 'bg-indigo-600 hover:bg-indigo-700'">{{ editingId ? 'Enregistrer' : 'Ajouter' }}</button>
                </div>
            </div>
        </div>
    </div>

    <div class="flex-1 flex flex-col min-w-0 bg-gray-100 relative">
        
        <div class="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-6 shadow-sm z-30" data-html2canvas-ignore>
            <div class="flex items-center gap-4">
                <h1 class="text-xl font-bold text-gray-800">Planning</h1>
            </div>
            <div class="flex gap-3">
                <button @click="resetAll" class="text-gray-500 hover:text-red-600 px-3 py-1 text-sm transition border border-transparent hover:border-red-200 rounded">
                    <i class="fas fa-bomb mr-1"></i> Reset Total
                </button>
                <button @click="exportPDF" :disabled="isExporting" class="bg-gray-700 hover:bg-gray-800 text-white px-4 py-2 rounded shadow transition flex items-center text-sm disabled:opacity-50 disabled:cursor-not-allowed">
                    <i class="fas mr-2" :class="isExporting ? 'fa-spinner fa-spin' : 'fa-file-pdf'"></i> 
                    {{ isExporting ? 'Export en cours...' : 'Exporter PDF' }}
                </button>
                <button @click="addEvent" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded shadow transition flex items-center text-sm">
                    <i class="fas fa-plus mr-2"></i> Événement
                </button>
            </div>
        </div>

        <div class="flex-1 overflow-auto p-6 custom-scrollbar" id="planning-container">
            
            <div id="planning-board" class="bg-white rounded-xl shadow-lg border-2 border-gray-300">
                
                <!-- En-tête du tableau -->
                <div class="grid gap-0 border-b-2 border-gray-300" :style="`grid-template-columns: 150px repeat(${events.length}, minmax(250px, 1fr))`">
                    <div class="bg-gray-800 text-white font-bold p-4 flex items-center justify-center border-r-2 border-gray-300">
                        <span>Service</span>
                    </div>
                    <div v-for="event in events" :key="event.id" class="bg-gray-800 text-white p-4 border-r-2 border-gray-300 last:border-r-0 group relative">
                        <div class="flex items-center justify-between">
                            <span class="font-bold text-sm cursor-pointer" @click="renameEvent(event)">{{ event.name }}</span>
                            <button @click="removeEvent(event.id)" class="text-gray-400 hover:text-red-400 transition ml-2" data-html2canvas-ignore>
                                <i class="fas fa-times text-xs"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Lignes du tableau -->
                <div v-for="(service, serviceIndex) in services" :key="service.id" 
                     class="grid gap-0 border-b border-gray-200 last:border-b-0"
                     :style="`grid-template-columns: 150px repeat(${events.length}, minmax(250px, 1fr))`"
                     :class="service.id === 'repos' ? 'bg-green-50/30' : ''">
                    
                    <!-- Nom du service -->
                    <div class="p-4 font-semibold border-r-2 border-gray-300 flex items-center justify-end text-right"
                         :class="service.id === 'repos' ? 'bg-green-100 text-green-700' : 'bg-gray-50 text-gray-700'">
                        {{ service.name }}
                    </div>

                    <!-- Cellules pour chaque événement -->
                    <div v-for="event in events" :key="event.id" 
                         class="p-3 min-h-[120px] border-r border-gray-200 last:border-r-0"
                         :class="service.id === 'repos' ? 'bg-green-50/50' : 'bg-white'">
                        <div 
                            @dragover.prevent
                            @drop="onDrop($event, event.id, service.id)"
                            class="h-full border-2 border-dashed rounded-lg transition-all p-2 flex flex-col gap-2"
                            :class="[
                                service.id === 'repos' ? 'border-green-300 bg-green-50' : 'border-gray-300 bg-gray-50',
                                dragOverId === event.id + service.id ? 'border-indigo-500 bg-indigo-50 ring-2 ring-indigo-200' : ''
                            ]"
                            @dragenter="dragOverId = event.id + service.id"
                            @dragleave="dragOverId = null"
                        >
                            <div v-if="getAssignments(event.id, service.id).length === 0" class="flex-1 flex items-center justify-center opacity-30">
                                <i class="fas fa-plus text-gray-400 text-xs"></i>
                            </div>

                            <div 
                                v-for="assign in getAssignments(event.id, service.id)" 
                                :key="assign.internalId"
                                draggable="true"
                                @dragstart="startDrag($event, assign.person, assign.internalId)"
                                class="bg-white border rounded shadow-sm p-2 text-sm relative group cursor-grab active:cursor-grabbing hover:shadow-md transition-all"
                                :class="getValidationClass(assign, event.id, service.id)"
                            >
                                <div class="flex justify-between items-start">
                                    <span class="font-bold text-gray-800 text-xs">{{ assign.person.name }}</span>
                                    <button @click.stop="removeAssignment(assign.internalId)" class="text-gray-300 hover:text-red-500 transition" data-html2canvas-ignore>
                                        <i class="fas fa-times text-xs"></i>
                                    </button>
                                </div>
                                <div v-if="assign.person.role === 'Conseil'" class="mt-1">
                                    <span class="text-[9px] bg-purple-100 text-purple-700 px-1 rounded">Conseil</span>
                                </div>
                                <div v-if="getFamilyWarning(assign, event.id, service.id)" class="mt-1 text-[9px] leading-tight text-red-700 bg-red-100 px-1.5 py-1 rounded flex items-start gap-1 border border-red-200">
                                    <i class="fas fa-heart-broken mt-0.5"></i>
                                    <span class="font-medium">Famille repos!</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const { createApp, ref, computed, reactive, nextTick } = Vue;

    createApp({
        setup() {
            const persons = ref([
                { id: 'p1', name: 'Loïc Dupont', role: 'Membre', familyId: 'Dupont' },
                { id: 'p2', name: 'Marie Dupont', role: 'Membre', familyId: 'Dupont' },
                { id: 'p3', name: 'Jean Martin', role: 'Conseil', familyId: 'Martin' },
                { id: 'p4', name: 'Sophie Martin', role: 'Membre', familyId: 'Martin' },
            ]);

            const services = ref([
                { id: 'accueil', name: 'Accueil' },
                { id: 'louange', name: 'Louange' },
                { id: 'predic', name: 'Prédication' },
                { id: 'enfants', name: 'Enfants' },
                { id: 'repos', name: 'EN REPOS' }, 
            ]);

            const events = ref([
                { id: 'e1', name: 'Dim 05 Jan' },
                { id: 'e2', name: 'Dim 12 Jan' },
                { id: 'e3', name: 'Dim 19 Jan' },
            ]);

            const assignments = ref([]);
            const dragOverId = ref(null);
            const searchQuery = ref("");
            const editingId = ref(null);
            const isFormOpen = ref(false); 
            const isPrinting = ref(false);
            const isExporting = ref(false);

            const formPerson = reactive({ name: "", role: "Membre", family: "" });

            const filteredPersons = computed(() => {
                if (!searchQuery.value) return persons.value;
                return persons.value.filter(p => p.name.toLowerCase().includes(searchQuery.value.toLowerCase()));
            });

            const getAssignments = (eventId, serviceId) => 
                assignments.value.filter(a => a.eventId === eventId && a.serviceId === serviceId);

            const getRestCount = (personId) => 
                assignments.value.filter(a => a.person.id === personId && a.serviceId === 'repos').length;

            const getFamilyWarning = (assignment, eventId, serviceId) => {
                if (assignment.person.role === 'Conseil') return false; 
                if (serviceId === 'repos' || !assignment.person.familyId) return false;
                
                const peopleInRest = getAssignments(eventId, 'repos');
                return peopleInRest.find(a => 
                    a.person.familyId === assignment.person.familyId && 
                    a.person.id !== assignment.person.id
                );
            };

            const getValidationClass = (assignment, eventId, serviceId) => {
                if (getFamilyWarning(assignment, eventId, serviceId)) return 'border-red-400 ring-1 ring-red-400 bg-red-50';
                if (serviceId === 'repos') return 'border-green-300 bg-green-50/80';
                return 'border-gray-200';
            };

            const exportPDF = async () => {
                isExporting.value = true;
                
                // Ajouter la classe au body
                document.body.classList.add('printing-active');
                
                await nextTick();
                await new Promise(resolve => setTimeout(resolve, 300));
                
                const element = document.getElementById('planning-board');
                
                try {
                    // Capturer avec html2canvas
                    const canvas = await html2canvas(element, {
                        scale: 2,
                        useCORS: true,
                        logging: false,
                        backgroundColor: '#ffffff',
                        windowWidth: element.scrollWidth + 100,
                        windowHeight: element.scrollHeight + 100,
                        x: 0,
                        y: 0
                    });
                    
                    // Créer le PDF avec jsPDF
                    const { jsPDF } = window.jspdf;
                    
                    const imgWidth = canvas.width;
                    const imgHeight = canvas.height;
                    
                    // Calculer les dimensions du PDF (A3 paysage en mm)
                    const pdfWidth = 420; // A3 largeur en mm
                    const pdfHeight = 297; // A3 hauteur en mm
                    
                    // Calculer le ratio pour adapter l'image
                    const ratio = Math.min(pdfWidth / imgWidth, pdfHeight / imgHeight);
                    const scaledWidth = imgWidth * ratio;
                    const scaledHeight = imgHeight * ratio;
                    
                    // Créer le PDF
                    const pdf = new jsPDF({
                        orientation: 'landscape',
                        unit: 'mm',
                        format: 'a3'
                    });
                    
                    // Centrer l'image
                    const xOffset = (pdfWidth - scaledWidth) / 2;
                    const yOffset = (pdfHeight - scaledHeight) / 2;
                    
                    const imgData = canvas.toDataURL('image/jpeg', 0.95);
                    pdf.addImage(imgData, 'JPEG', xOffset, yOffset, scaledWidth, scaledHeight);
                    
                    // Sauvegarder
                    pdf.save(`planning-eglise-${new Date().toISOString().split('T')[0]}.pdf`);
                    
                } catch (error) {
                    console.error('Erreur lors de l\'export PDF:', error);
                    alert('Une erreur est survenue lors de l\'export PDF. Veuillez réessayer.');
                } finally {
                    document.body.classList.remove('printing-active');
                    isPrinting.value = false;
                    isExporting.value = false;
                }
            };

            const startEdit = (person) => {
                editingId.value = person.id;
                formPerson.name = person.name;
                formPerson.role = person.role;
                formPerson.family = person.familyId || "";
                isFormOpen.value = true; 
            };

            const cancelEdit = () => {
                editingId.value = null;
                formPerson.name = ""; formPerson.role = "Membre"; formPerson.family = "";
                isFormOpen.value = false; 
            };

            const toggleForm = () => {
                isFormOpen.value = !isFormOpen.value;
                if(!isFormOpen.value) {
                    editingId.value = null;
                    formPerson.name = ""; formPerson.role = "Membre"; formPerson.family = "";
                }
            };

            const savePerson = () => {
                if(!formPerson.name.trim()) return;

                if (editingId.value) {
                    const index = persons.value.findIndex(p => p.id === editingId.value);
                    if (index !== -1) {
                        persons.value[index].name = formPerson.name;
                        persons.value[index].role = formPerson.role;
                        persons.value[index].familyId = formPerson.family || null;
                        
                        assignments.value.forEach(assign => {
                            if (assign.person.id === editingId.value) {
                                assign.person.name = formPerson.name;
                                assign.person.role = formPerson.role;
                                assign.person.familyId = formPerson.family || null;
                            }
                        });
                    }
                } else {
                    persons.value.push({
                        id: 'p' + Date.now(),
                        name: formPerson.name,
                        role: formPerson.role,
                        familyId: formPerson.family || null
                    });
                }
                
                if (editingId.value) { cancelEdit(); } 
                else { formPerson.name = ""; formPerson.role = "Membre"; formPerson.family = ""; }
            };

            const startDrag = (evt, person, assignmentId) => {
                evt.dataTransfer.dropEffect = 'move';
                evt.dataTransfer.effectAllowed = 'all';
                const payload = { person: person, sourceId: assignmentId };
                evt.dataTransfer.setData('payload', JSON.stringify(payload));
            };

            const onDrop = (evt, eventId, serviceId) => {
                dragOverId.value = null;
                const raw = evt.dataTransfer.getData('payload');
                if (!raw) return;
                
                const { person, sourceId } = JSON.parse(raw);

                if (person.role !== 'Conseil') {
                    const existing = assignments.value.find(a => 
                        a.eventId === eventId && 
                        a.person.id === person.id && 
                        a.internalId !== sourceId
                    );
                    if (existing) {
                        alert(`🚫 ${person.name} est déjà sur cet événement.`);
                        return;
                    }
                }

                if (sourceId) removeAssignment(sourceId);

                assignments.value.push({
                    internalId: Date.now() + Math.random(),
                    person: person,
                    eventId: eventId,
                    serviceId: serviceId
                });
            };

            const removeAssignment = (id) => assignments.value = assignments.value.filter(a => a.internalId !== id);
            
            const renameEvent = (event) => {
                const newName = prompt("Renommer l'événement :", event.name);
                if (newName && newName.trim()) event.name = newName;
            };

            const removeEvent = (id) => {
                if(confirm("Supprimer cette colonne ?")) {
                    events.value = events.value.filter(e => e.id !== id);
                    assignments.value = assignments.value.filter(a => a.eventId !== id);
                }
            };
            const addEvent = () => events.value.push({ id: 'e' + Date.now(), name: 'Nouv. Event' });
            
            const resetAll = () => { 
                if(confirm("ATTENTION : Cela va supprimer TOUS les événements et le planning en cours. Tout effacer ?")) {
                    assignments.value = [];
                    events.value = []; 
                } 
            };

            return {
                persons, services, events, assignments, searchQuery, filteredPersons,
                dragOverId, formPerson, editingId, isFormOpen, isPrinting, isExporting,
                getAssignments, startDrag, onDrop, removeAssignment,
                getFamilyWarning, getValidationClass, getRestCount,
                addEvent, removeEvent, renameEvent, resetAll,
                savePerson, startEdit, cancelEdit, toggleForm, exportPDF
            };
        }
    }).mount('#app');
</script>
</body>
</html>
